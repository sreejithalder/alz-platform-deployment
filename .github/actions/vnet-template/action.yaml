name: "Virtual Network Wrapper"
description: "Validate and deploy Virtual Network via AVM Bicep"
inputs:
  resourceGroupName:
    required: true
  vnetName:
    required: true
  location:
    required: true
  addressPrefixes:
    required: true
  subnets:
    required: false
    default: "[]"
  dnsServers:
    required: false
    default: "[]"
  ddosProtectionPlanResourceId:
    required: false
    default: ""
  peerings:
    required: false
    default: "[]"
  vnetEncryption:
    required: false
    default: "false"
  vnetEncryptionEnforcement:
    required: false
    default: "AllowUnencrypted"
  flowTimeoutInMinutes:
    required: false
    default: "0"
  enableVmProtection:
    required: false
    default: "false"
  virtualNetworkBgpCommunity:
    required: false
    default: ""
  diagnosticSettings:
    required: false
    default: "[]"
  lock:
    required: false
    default: "{}"
  roleAssignments:
    required: false
    default: "[]"
  tags:
    required: false
    default: "{}"
  enableTelemetry:
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Validate location
      shell: bash
      run: |
        az account list-locations --query "[?name=='${{ inputs.location }}']" --output tsv \
          || { echo "Invalid location: ${{ inputs.location }}"; exit 1; }

    - name: Validate Resource Group exists
      shell: bash
      run: |
        az group show --name "${{ inputs.resourceGroupName }}" \
          || { echo "Resource Group not found: ${{ inputs.resourceGroupName }}"; exit 1; }

    - name: Build params.json
      shell: bash
      run: |
        # Write every input to individual env-var files so Python can read them
        # without any shell quoting/escaping issues. This is the safest way to
        # pass JSON blobs that may contain quotes, brackets, and slashes into
        # Python from a GitHub Actions composite step.

        printf '%s' '${{ inputs.vnetName }}'                     > /tmp/p_name.txt
        printf '%s' '${{ inputs.location }}'                     > /tmp/p_location.txt
        printf '%s' '${{ inputs.addressPrefixes }}'              > /tmp/p_addressPrefixes.txt
        printf '%s' '${{ inputs.subnets }}'                      > /tmp/p_subnets.txt
        printf '%s' '${{ inputs.dnsServers }}'                   > /tmp/p_dnsServers.txt
        printf '%s' '${{ inputs.peerings }}'                     > /tmp/p_peerings.txt
        printf '%s' '${{ inputs.diagnosticSettings }}'           > /tmp/p_diagnosticSettings.txt
        printf '%s' '${{ inputs.roleAssignments }}'              > /tmp/p_roleAssignments.txt
        printf '%s' '${{ inputs.lock }}'                         > /tmp/p_lock.txt
        printf '%s' '${{ inputs.tags }}'                         > /tmp/p_tags.txt
        printf '%s' '${{ inputs.vnetEncryption }}'               > /tmp/p_vnetEncryption.txt
        printf '%s' '${{ inputs.vnetEncryptionEnforcement }}'    > /tmp/p_vnetEncryptionEnforcement.txt
        printf '%s' '${{ inputs.flowTimeoutInMinutes }}'         > /tmp/p_flowTimeout.txt
        printf '%s' '${{ inputs.enableVmProtection }}'           > /tmp/p_enableVmProtection.txt
        printf '%s' '${{ inputs.enableTelemetry }}'              > /tmp/p_enableTelemetry.txt
        printf '%s' '${{ inputs.ddosProtectionPlanResourceId }}' > /tmp/p_ddos.txt
        printf '%s' '${{ inputs.virtualNetworkBgpCommunity }}'   > /tmp/p_bgp.txt

        python3 << 'PYEOF'
        import json, os

        def read(path):
            return open(path).read().strip()

        def read_json(path, default):
            raw = read(path)
            if not raw:
                return default
            try:
                return json.loads(raw)
            except json.JSONDecodeError as e:
                raise ValueError(f"Invalid JSON in {path}: {e}\nContent: {raw!r}")

        def read_bool(path, default=False):
            v = read(path).lower()
            return v in ("true", "1", "yes")

        def read_int(path, default=0):
            v = read(path)
            try:
                return int(v)
            except (ValueError, TypeError):
                return default

        params = {
            "name":                      {"value": read("/tmp/p_name.txt")},
            "location":                  {"value": read("/tmp/p_location.txt")},
            "addressPrefixes":           {"value": read_json("/tmp/p_addressPrefixes.txt", [])},
            "subnets":                   {"value": read_json("/tmp/p_subnets.txt", [])},
            "dnsServers":                {"value": read_json("/tmp/p_dnsServers.txt", [])},
            "peerings":                  {"value": read_json("/tmp/p_peerings.txt", [])},
            "diagnosticSettings":        {"value": read_json("/tmp/p_diagnosticSettings.txt", [])},
            "roleAssignments":           {"value": read_json("/tmp/p_roleAssignments.txt", [])},
            "lock":                      {"value": read_json("/tmp/p_lock.txt", {})},
            "tags":                      {"value": read_json("/tmp/p_tags.txt", {})},
            "vnetEncryption":            {"value": read_bool("/tmp/p_vnetEncryption.txt")},
            "vnetEncryptionEnforcement": {"value": read("/tmp/p_vnetEncryptionEnforcement.txt") or "AllowUnencrypted"},
            "flowTimeoutInMinutes":      {"value": read_int("/tmp/p_flowTimeout.txt")},
            "enableVmProtection":        {"value": read_bool("/tmp/p_enableVmProtection.txt")},
            "enableTelemetry":           {"value": read_bool("/tmp/p_enableTelemetry.txt", True)},
        }

        # Optional fields — only include when non-empty to avoid Bicep null errors
        ddos = read("/tmp/p_ddos.txt")
        if ddos:
            params["ddosProtectionPlanResourceId"] = {"value": ddos}

        bgp = read("/tmp/p_bgp.txt")
        if bgp:
            params["virtualNetworkBgpCommunity"] = {"value": bgp}

        output = json.dumps(params, indent=2)
        open("params.json", "w").write(output)
        print("Generated params.json:")
        print(output)
        PYEOF

        # Final safety check
        python3 -c "import json; json.load(open('params.json'))" \
          || { echo 'ERROR: params.json failed final JSON validation'; cat params.json; exit 1; }

    - name: Validate Bicep deployment
      shell: bash
      run: |
        BICEP_FILE="bicep/res/network/virtual-network/main.bicep"
        echo "Bicep file path: $BICEP_FILE"
        cat "$BICEP_FILE" || { echo "Bicep file not found at $BICEP_FILE"; exit 1; }

        az deployment group validate \
          --resource-group "${{ inputs.resourceGroupName }}" \
          --template-file "$BICEP_FILE" \
          --parameters @params.json

    - name: Deploy Virtual Network
      shell: bash
      run: |
        BICEP_FILE="bicep/res/network/virtual-network/main.bicep"
        az deployment group create \
          --resource-group "${{ inputs.resourceGroupName }}" \
          --template-file "$BICEP_FILE" \
          --parameters @params.json

    - name: Deployment Confirmation
      shell: bash
      run: |
        echo "Successfully deployed Virtual Network: ${{ inputs.vnetName }} into RG: ${{ inputs.resourceGroupName }}"
