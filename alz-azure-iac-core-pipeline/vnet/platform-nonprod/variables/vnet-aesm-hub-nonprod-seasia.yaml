variables:
  # ── Common values ─────────────────────────────────────────────────────────
  - name: ENVIRONMENT
    value: NONPROD
  - name: AZURE_SUBSCRIPTION
    value: azure-platform-nonprod
  - name: location
    value: southeastasia
  - name: subscriptionId
    value: 38f508c2-eca9-46a9-bfff-a6d3bc4f11d2
  - name: enableTelemetry
    value: true

  # ── Tags ──────────────────────────────────────────────────────────────────
  - name: tags_OFFICE
    value: HKG
  - name: tags_PROJECTS
    value: AE_Network_SERVICES
  - name: tags_TECH STACK CATEGORY
    value: CLOUD PLATFORM
  - name: tags_Description
    value: Hub VNet in Platform NonProd

  # ── Resource targeting ────────────────────────────────────────────────────
  - name: resourceGroupName
    value: rg-aesm-shared-nonprod-seasia

  # ── VNet core ─────────────────────────────────────────────────────────────
  - name: vnetName
    value: vnet-aesm-hub-nonprod-seasia

  # IMPORTANT: All JSON values MUST use single-quoted inline scalars.
  # Do NOT use YAML block scalars (> or >- or |) for JSON values.
  # The Python extractor in main.yaml relies on the pattern:
  #   - name: <fieldName>
  #     value: '<json>'

  - name: addressPrefixes
    value: '["10.10.0.0/16"]'

  # ── DNS Servers ───────────────────────────────────────────────────────────
  # Use '[]' to inherit Azure-provided DNS
  - name: dnsServers
    value: '["10.10.0.4","10.10.0.5"]'

  # ── Subnets ───────────────────────────────────────────────────────────────
  # All on one line inside single quotes. Fields per subnet:
  #   name (required), addressPrefix (required if addressPrefixes not set),
  #   delegation, networkSecurityGroupResourceId, routeTableResourceId,
  #   natGatewayResourceId, privateEndpointNetworkPolicies,
  #   privateLinkServiceNetworkPolicies, serviceEndpoints[], defaultOutboundAccess
  - name: subnets
    value: '[{"name":"snet-app","addressPrefix":"10.10.1.0/24","privateEndpointNetworkPolicies":"Disabled","privateLinkServiceNetworkPolicies":"Enabled","serviceEndpoints":["Microsoft.Storage","Microsoft.KeyVault"],"defaultOutboundAccess":false},{"name":"snet-data","addressPrefix":"10.10.2.0/24","privateEndpointNetworkPolicies":"Disabled","privateLinkServiceNetworkPolicies":"Disabled","serviceEndpoints":["Microsoft.Sql","Microsoft.Storage"]},{"name":"snet-mgmt","addressPrefix":"10.10.3.0/24","privateEndpointNetworkPolicies":"Enabled"},{"name":"AzureBastionSubnet","addressPrefix":"10.10.4.0/27"},{"name":"GatewaySubnet","addressPrefix":"10.10.5.0/27"}]'

  # ── Peerings ─────────────────────────────────────────────────────────────
  # remotePeeringEnabled:true deploys BOTH sides in one pass.
  # NOTE: useRemoteGateways:true requires the remote VNet to have a gateway.
  #       Set to false if no VPN/ER gateway exists on the remote side yet.
  - name: peerings
    value: '[{"name":"peer-shared-nonprod-to-hub","remoteVirtualNetworkResourceId":"/subscriptions/38f508c2-eca9-46a9-bfff-a6d3bc4f11d2/resourceGroups/rg-test-sree-ci-001/providers/Microsoft.Network/virtualNetworks/vnet-sree-test-ci-001","allowForwardedTraffic":true,"allowGatewayTransit":false,"allowVirtualNetworkAccess":true,"useRemoteGateways":false,"doNotVerifyRemoteGateways":true,"remotePeeringEnabled":true,"remotePeeringName":"peer-hub-to-shared-nonprod","remotePeeringAllowForwardedTraffic":true,"remotePeeringAllowGatewayTransit":false,"remotePeeringAllowVirtualNetworkAccess":true,"remotePeeringUseRemoteGateways":false,"remotePeeringDoNotVerifyRemoteGateways":true}]'

  # ── Diagnostic Settings ───────────────────────────────────────────────────
  # Replace workspaceResourceId with real Log Analytics Workspace resource ID.
  - name: diagnosticSettings
    value: '[{"name":"diag-vnet-aesm-hub-nonprod-seasia","workspaceResourceId":"/subscriptions/38f508c2-eca9-46a9-bfff-a6d3bc4f11d2/resourcegroups/rg-test-sree-ci-001/providers/microsoft.operationalinsights/workspaces/log-sree-test-ci-001","logCategoriesAndGroups":[{"categoryGroup":"allLogs","enabled":true}],"metricCategories":[{"category":"AllMetrics","enabled":true}]}]'

  # ── Role Assignments ──────────────────────────────────────────────────────
  - name: roleAssignments
    value: '[]'

  # ── Lock ─────────────────────────────────────────────────────────────────
  # kind: "CanNotDelete" | "ReadOnly" | "None" — use '{}' to skip locking
  - name: lock
    value: '{}'

  # ── Optional advanced settings ────────────────────────────────────────────
  - name: vnetEncryption
    value: false
  - name: vnetEncryptionEnforcement
    value: AllowUnencrypted
  - name: flowTimeoutInMinutes
    value: 0
  - name: enableVmProtection
    value: false
  - name: ddosProtectionPlanResourceId
    value: ""
  - name: virtualNetworkBgpCommunity
    value: ""
