variables:
  # ── Common values ─────────────────────────────────────────────────────────
  - name: ENVIRONMENT
    value: NONPROD
  - name: AZURE_SUBSCRIPTION
    value: azure-platform-nonprod
  - name: location
    value: southeastasia
  - name: subscriptionId
    value: 38f508c2-eca9-46a9-bfff-a6d3bc4f11d2
  - name: enableTelemetry
    value: true

  # ── Tags ──────────────────────────────────────────────────────────────────
  - name: tags_OFFICE
    value: HKG
  - name: tags_PROJECTS
    value: AE_Network_SERVICES
  - name: tags_TECH STACK CATEGORY
    value: CLOUD PLATFORM
  - name: tags_Description
    value: Hub VNet in Platform NonProd

  # ── Resource targeting ────────────────────────────────────────────────────
  - name: resourceGroupName
    value: rg-aesm-shared-nonprod-seasia

  # ── VNet core ─────────────────────────────────────────────────────────────
  - name: vnetName
    value: vnet-aesm-hub-nonprod-seasia

  - name: addressPrefixes
    # JSON array — add more CIDRs if required
    value: ["10.10.0.0/16"]

  # ── DNS Servers ───────────────────────────────────────────────────────────
  # Leave as '[]' to inherit Azure-provided DNS
  - name: dnsServers
    value: '["10.10.0.4", "10.10.0.5"]'

  # ── Subnets ───────────────────────────────────────────────────────────────
  # Full subnetType object array. All optional fields may be omitted.
  # Fields per subnet:
  #   name                              (required)
  #   addressPrefix                     (required if addressPrefixes not set)
  #   addressPrefixes                   (required if addressPrefix not set)
  #   delegation                        e.g. "Microsoft.Web/serverFarms"
  #   networkSecurityGroupResourceId    resource ID of existing NSG
  #   routeTableResourceId              resource ID of existing Route Table
  #   natGatewayResourceId              resource ID of existing NAT GW
  #   privateEndpointNetworkPolicies    "Disabled"|"Enabled"|"NetworkSecurityGroupEnabled"|"RouteTableEnabled"
  #   privateLinkServiceNetworkPolicies "Disabled"|"Enabled"
  #   serviceEndpoints                  array of strings, e.g. ["Microsoft.Storage","Microsoft.Sql"]
  #   defaultOutboundAccess             true|false
  #   roleAssignments                   array of roleAssignmentType objects
  - name: subnets
    value: >-
      [
        {
          "name": "snet-app",
          "addressPrefix": "10.10.1.0/24",
          "privateEndpointNetworkPolicies": "Disabled",
          "privateLinkServiceNetworkPolicies": "Enabled",
          "serviceEndpoints": ["Microsoft.Storage", "Microsoft.KeyVault"],
          "defaultOutboundAccess": false
        },
        {
          "name": "snet-data",
          "addressPrefix": "10.10.2.0/24",
          "privateEndpointNetworkPolicies": "Disabled",
          "privateLinkServiceNetworkPolicies": "Disabled",
          "serviceEndpoints": ["Microsoft.Sql", "Microsoft.Storage"]
        },
        {
          "name": "snet-mgmt",
          "addressPrefix": "10.10.3.0/24",
          "privateEndpointNetworkPolicies": "Enabled"
        },
        {
          "name": "AzureBastionSubnet",
          "addressPrefix": "10.10.4.0/27"
        },
        {
          "name": "GatewaySubnet",
          "addressPrefix": "10.10.5.0/27"
        }
      ]

  # ── Peerings ─────────────────────────────────────────────────────────────
  # Set remotePeeringEnabled: true to deploy BOTH sides in one pass.
  # Fields per peering:
  #   remoteVirtualNetworkResourceId    (required)
  #   name                              optional override
  #   allowForwardedTraffic             default true
  #   allowGatewayTransit               default false
  #   allowVirtualNetworkAccess         default true
  #   doNotVerifyRemoteGateways         default true
  #   useRemoteGateways                 default false
  #   remotePeeringEnabled              deploy reverse peering as well
  #   remotePeeringName                 optional override for reverse peering
  #   remotePeeringAllowForwardedTraffic
  #   remotePeeringAllowGatewayTransit
  #   remotePeeringAllowVirtualNetworkAccess
  #   remotePeeringDoNotVerifyRemoteGateways
  #   remotePeeringUseRemoteGateways
  - name: peerings
    # Replace remoteVirtualNetworkResourceId with real hub VNet resource ID
    value: >-
      [
        {
          "name": "peer-shared-nonprod-to-hub",
          "remoteVirtualNetworkResourceId": "/subscriptions/38f508c2-eca9-46a9-bfff-a6d3bc4f11d2/resourceGroups/rg-test-sree-ci-001/providers/Microsoft.Network/virtualNetworks/vnet-sree-test-ci-001",
          "allowForwardedTraffic": true,
          "allowGatewayTransit": false,
          "allowVirtualNetworkAccess": true,
          "useRemoteGateways": true,
          "doNotVerifyRemoteGateways": true,
          "remotePeeringEnabled": true,
          "remotePeeringName": "peer-hub-to-shared-nonprod",
          "remotePeeringAllowForwardedTraffic": true,
          "remotePeeringAllowGatewayTransit": true,
          "remotePeeringAllowVirtualNetworkAccess": true,
          "remotePeeringUseRemoteGateways": false,
          "remotePeeringDoNotVerifyRemoteGateways": true
        }
      ]

  # ── Diagnostic Settings ───────────────────────────────────────────────────
  # Replace workspaceResourceId with the real Log Analytics Workspace resource ID.
  # logCategoriesAndGroups and metricCategories can be trimmed to specific
  # categories or left as shown to capture everything.
  - name: diagnosticSettings
    value: >-
      [
        {
          "name": "diag-vnet-aesm-hub-nonprod-seasia",
          "workspaceResourceId": "/subscriptions/38f508c2-eca9-46a9-bfff-a6d3bc4f11d2/resourcegroups/rg-test-sree-ci-001/providers/microsoft.operationalinsights/workspaces/log-sree-test-ci-001",
          "logCategoriesAndGroups": [
            { "categoryGroup": "allLogs", "enabled": true }
          ],
          "metricCategories": [
            { "category": "AllMetrics", "enabled": true }
          ]
        }
      ]

  # ── Role Assignments ──────────────────────────────────────────────────────
  # principalType: "ServicePrincipal"|"User"|"Group"
  # roleDefinitionIdOrName: built-in name OR GUID OR full resource ID
  - name: roleAssignments
    value: "[]"

  # ── Lock ─────────────────────────────────────────────────────────────────
  # kind: "CanNotDelete" | "ReadOnly" | "None"  (omit block or use {} to skip)
  - name: lock
    value: '{ "kind": "CanNotDelete", "name": "lock-vnet-aesm-shared-nonprod" }'

  # ── Optional advanced settings ────────────────────────────────────────────
  - name: vnetEncryption
    value: false
  - name: vnetEncryptionEnforcement
    value: AllowUnencrypted
  - name: flowTimeoutInMinutes
    value: 0
  - name: enableVmProtection
    value: false
  - name: ddosProtectionPlanResourceId
    value: ""
  - name: virtualNetworkBgpCommunity
    value: ""
